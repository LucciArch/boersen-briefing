<title>Sprachkalender ist umgezogen</title>
<style>body{font-family:system-ui,sans-serif;background:#101218;color:#eef0f5;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}a{color:#8c80ff}</style>

<body>
<p>Der Sprachkalender ist umgezogen:<br><a href="https://lucciarch.github.io/sprachkalender/">lucciarch.github.io/sprachkalender</a></p>
<script>
// Alten Service Worker dieses Ordners entfernen, dann weiterleiten
(async () => {
  try {
    const regs = await navigator.serviceWorker?.getRegistrations() || [];
    await Promise.all(regs.filter(r => new URL(r.scope).pathname === "/boersen-briefing/kalender/").map(r => r.unregister()));
    const keys = await caches.keys();
    await Promise.all(keys.filter(k => k.startsWith("kalender-")).map(k => caches.delete(k)));
  } catch (e) {}
  location.replace("https://lucciarch.github.io/sprachkalender/");
})();
</script>
</body>
